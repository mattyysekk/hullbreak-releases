# Builds Hullbreak 3D for Windows and publishes it as the current release here (the previous one stays too),
# where the game's launcher looks for updates.
#
# Runs when build.txt changes (a new version to build), or by hand from the Actions tab.
# The game's code lives in a private repository: SOURCE_TOKEN is a token that can read it.
name: Build and release

on:
  push:
    branches: [main]
    paths: [build.txt, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: releases

      - name: What to build
        id: what
        shell: bash
        run: |
          version=$(grep '^version=' releases/build.txt | cut -d= -f2 | tr -d '\r ')
          commit=$(grep '^commit=' releases/build.txt | cut -d= -f2 | tr -d '\r ')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          # done already (the installer and latest.yml are both up): nothing to do
          assets=$(gh release view "v$version" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$assets" | grep -q '^latest.yml$' && echo "$assets" | grep -q 'setup.exe$'; then
            echo "v$version is already released: nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the source token is there
        if: steps.what.outputs.skip != 'true'
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Add the SOURCE_TOKEN secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Get the game's code
        if: steps.what.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: mattyysekk/hullbreak
          token: ${{ secrets.SOURCE_TOKEN }}
          ref: ${{ steps.what.outputs.commit }}
          path: game
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.what.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.what.outputs.skip != 'true'
        working-directory: game
        run: npm ci

      - name: Build the game
        if: steps.what.outputs.skip != 'true'
        working-directory: game
        run: npm run build

      - name: Build the installer
        if: steps.what.outputs.skip != 'true'
        shell: bash
        working-directory: game
        run: |
          set -o pipefail
          if ! npx electron-builder --win nsis --publish never 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            tail -n 15 "$RUNNER_TEMP/build.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          ls -la dist

      - name: Publish the release
        if: steps.what.outputs.skip != 'true'
        shell: bash
        working-directory: game
        run: |
          version="${{ steps.what.outputs.version }}"
          tag="v$version"
          # a half-finished release of this version (from a failed run) goes first
          gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          files=(dist/*-setup.exe dist/*-setup.exe.blockmap dist/latest.yml)
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }; done
          notes="Download **$(basename dist/*-setup.exe)** below and run it. Once installed, the game updates itself."
          ok=0
          for try in 1 2 3; do
            if gh release create "$tag" "${files[@]}" -R "$GITHUB_REPOSITORY" --title "Hullbreak 3D v$version" --notes "$notes" --latest 2> err.txt; then ok=1; break; fi
            echo "::warning::try $try: $(tr '\n' ' ' < err.txt)"
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
            sleep 10
          done
          [ $ok = 1 ] || { echo "::error::could not publish: $(tr '\n' ' ' < err.txt)"; exit 1; }

      - name: Keep only the newest two releases
        if: steps.what.outputs.skip != 'true'
        shell: bash
        run: |
          # the previous release stays: the launcher compares against its blockmap and
          # downloads only the parts of the game that changed
          version="${{ steps.what.outputs.version }}"
          kept=0
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' | while read -r tag; do
            if [ "$tag" = "v$version" ]; then continue; fi
            kept=$((kept + 1))
            if [ "$kept" -le 1 ]; then echo "Keeping the previous release $tag"; continue; fi
            echo "Removing old release $tag"
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
